<div class="split-view">
  <!-- Bible panel (left) -->
  <app-bible-viewer
    [supplementalEntries]="bibleSupplementalEntries"
    (timelineAnchorSelected)="jumpToBibleTimelineAnchor($event)"
  />

  <!-- Timeline panel (right) -->
  <div class="timeline-panel">
    <!-- Space scene (Earth + starfield 3D) -->
    <app-space-scene (sceneReady)="updateSpaceSceneTimeSpeed(true)" />

    <!-- Centerline + timeline on top -->
    <canvas #centerline id="centerline" class="layer"></canvas>
    <canvas #timeline id="timeline" class="layer"></canvas>

    <!-- Scroller to provide vertical space (height set in TS) -->
    <main class="scrollbounds"></main>

    <!-- Settings UI (contains zoom slider) -->
    <app-settings-control class="timeline-settings">
      <div class="timeline-search-control">
        <label for="timelineSearch">Go to</label>
        <div class="timeline-search-row">
          <input
            id="timelineSearch"
            type="search"
            placeholder="Search events, places, or dates"
            [value]="timelineSearchQuery"
            (input)="onTimelineSearchInput($event)"
            (keydown.enter)="jumpToFirstTimelineSearchResult()"
          />
          <button
            type="button"
            class="timeline-search-clear"
            *ngIf="timelineSearchQuery"
            (click)="clearTimelineSearch()"
            title="Clear search"
          >
            &times;
          </button>
        </div>
        <div class="timeline-search-results" *ngIf="timelineSearchResults.length">
          <button
            type="button"
            class="timeline-search-result"
            *ngFor="let result of timelineSearchResults"
            (click)="jumpToTimelineEntry(result)"
          >
            <span class="timeline-search-result-label">{{ result.label }}</span>
            <span class="timeline-search-result-title">
              {{ result.location?.name || result.when }}
            </span>
          </button>
        </div>
        <button
          type="button"
          class="timeline-search-result timeline-date-result"
          *ngIf="timelineDateJump && !timelineSearchResults.length"
          (click)="jumpToTimelineDate()"
        >
          <span class="timeline-search-result-label">Jump to date</span>
          <span class="timeline-search-result-title">{{ timelineDateJump.label }}</span>
        </button>
      </div>
      <app-zoom-control
        [min]="0"
        [max]="zoomLevels.length - 1"
        [labels]="zoomLabels"
        [value]="currentZoomIdx"
        [captionOverride]="zoomStepLabel || null"
        [bridgeStart]="ZOOM_ANIM.active ? zoomVisualIndex : null"
        [bridgeEnd]="ZOOM_ANIM.active ? ZOOM_ANIM.targetIdx : null"
        [disabled]="scrollLocked || ZOOM_ANIM.active"
        (inputValue)="onZoomInput($event)"
        (valueChange)="onZoomChange($event)"
      />
      <label class="time-speed-control">
        <span>Time:</span>
        <select [value]="timeProgressionMultiplier" (change)="onTimeProgressionChange($event)">
          <option *ngFor="let option of timeProgressionOptions" [value]="option.multiplier">
            {{ option.label }}
          </option>
        </select>
      </label>
    </app-settings-control>
  </div>
</div>
