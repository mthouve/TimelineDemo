<div class="bible-viewer">
  <div class="bible-header">
    <select [value]="selectedBook()?.name" (change)="onBookChange($event)">
      <option *ngFor="let book of books()" [value]="book.name">{{ book.name }}</option>
    </select>
    <select *ngIf="selectedBook()" [value]="selectedChapter()" (change)="onChapterChange($event)">
      <option *ngFor="let chapter of selectedBook()?.chapters" [value]="chapter.chapter">
        {{ chapter.chapter }}
      </option>
    </select>
    <input
      type="text"
      placeholder="Search Bible..."
      [(ngModel)]="searchQueryText"
      (input)="search()"
    />
    <button (click)="clearSearch()" *ngIf="searchQueryText">Clear</button>
  </div>

  <div
    class="bible-content"
    *ngIf="!searchQueryText || searchResults().length === 0"
    #bibleContent
    (wheel)="onWheel($event, bibleContent)"
  >
    <div
      *ngFor="let verse of verses()"
      class="bible-verse"
      [class.with-originals]="showOriginals()"
    >
      <div class="verse-line">
        <span class="ref"
          >{{ selectedBook()?.abbreviation }} {{ selectedChapter() }}:{{ verse.verse }}</span
        >
        <span class="text" [innerHTML]="formatVerseHtml(verse.text)"></span>
      </div>
      <div class="orig-text" *ngIf="showOriginals()">
        <div class="hebrew" *ngIf="getOriginalText(verse.book, verse.chapter, verse.verse).hebrew">
          {{ getOriginalText(verse.book, verse.chapter, verse.verse).hebrew }}
        </div>
        <div class="greek" *ngIf="getOriginalText(verse.book, verse.chapter, verse.verse).greek">
          {{ getOriginalText(verse.book, verse.chapter, verse.verse).greek }}
        </div>
      </div>
    </div>
  </div>

  <div
    class="bible-search-results"
    *ngIf="searchResults().length > 0"
    #searchResultsContainer
    (wheel)="onWheel($event, searchResultsContainer)"
  >
    <button
      *ngFor="let result of searchResults()"
      type="button"
      class="search-result"
      (click)="goToReference(result.reference)"
    >
      <span class="ref">{{ formatReference(result.reference) }}</span>
      <span class="preview" [innerHTML]="result.preview"></span>
    </button>
  </div>
</div>
